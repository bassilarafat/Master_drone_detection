[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "master-drone-detection"
version = "0.1.0"
description = "Reproducible drone detection experiments and analysis"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
drone-detection = "drone_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
